name: Tests and Sonar

on:
  push:
    branches:
      - master
      - feature/**
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Set up job
        run: echo "Starting job"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build project
        working-directory: ./cours-devops/simpleapi
        run: mvn clean compile

      - name: Run tests
        working-directory: ./cours-devops/simpleapi
        run: mvn test

      - name: SonarCloud analysis
        if: github.ref == 'refs/heads/master'
        working-directory: ./cours-devops/simpleapi
        run: mvn sonar:sonar -Dsonar.projectKey=Patrice-IPE_simple-api -Dsonar.organization=patrice-ipe -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Check Quality Gate
        if: github.ref == 'refs/heads/master'
        working-directory: ./cours-devops/simpleapi
        run: mvn sonar:sonar -Dsonar.qualitygate.wait=true -Dsonar.projectKey=Patrice-IPE_simple-api -Dsonar.organization=patrice-ipe -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=${{ secrets.SONAR_TOKEN }}
