name: Tests and Sonar

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Build
      - name: Build project
        run: mvn clean compile --file ./cours-devops/simpleapi/pom.xml

      # Tests
      - name: Run tests
        run: mvn test --file ./cours-devops/simpleapi/pom.xml

      # Sonar
      - name: SonarCloud analysis
        run: mvn sonar:sonar \
          -Dsonar.projectKey=Patrice-IPE_DevOps-MlOps \
          -Dsonar.organization=patrice-ipe \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
          --file ./cours-devops/simpleapi/pom.xml