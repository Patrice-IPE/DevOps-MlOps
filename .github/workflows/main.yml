name: CI devops 2025

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:

  # -----------------------------
  # 1. BUILD + TEST + SONAR
  # -----------------------------
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      # Récupération du code
      - name: Checkout code
        uses: actions/checkout@v4

      # Installation de Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Compilation du projet
      - name: Build project
        working-directory: ./cours-devops/simpleapi
        run: mvn clean compile

      # Exécution des tests
      - name: Run tests
        working-directory: ./cours-devops/simpleapi
        run: mvn test

      # Analyse SonarCloud
      - name: SonarCloud analysis
        working-directory: ./cours-devops/simpleapi
        run: mvn sonar:sonar -Dsonar.projectKey=Patrice-IPE_DevOps-MlOps -Dsonar.organization=patrice-ipe -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # Vérification du Quality Gate
      # Permet de faire échouer le pipeline si la qualité est insuffisante
      - name: Check Quality Gate
        working-directory: ./cours-devops/simpleapi
        run: mvn sonar:sonar -Dsonar.qualitygate.wait=true -Dsonar.projectKey=Patrice-IPE_DevOps-MlOps -Dsonar.organization=patrice-ipe -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  # -----------------------------
  # 2. BUILD IMAGE BACKEND
  # -----------------------------
  build-backend:
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      # Récupération du code
      - name: Checkout code
        uses: actions/checkout@v4

      # Authentification DockerHub
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # Build et push de l'image backend
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./cours-devops/simpleapi
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-backend:latest

  # -----------------------------
  # 3. BUILD IMAGE DATABASE
  # -----------------------------
  build-database:
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      # Récupération du code
      - name: Checkout code
        uses: actions/checkout@v4

      # Authentification DockerHub
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # Build et push de l'image database
      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: ./cours-devops/Database
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest

  # -----------------------------
  # 4. BUILD IMAGE HTTP SERVER
  # -----------------------------
  build-httpd:
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      # Récupération du code
      - name: Checkout code
        uses: actions/checkout@v4

      # Authentification DockerHub
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # Build et push de l'image serveur HTTP
      - name: Build and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./cours-devops/http-server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest