name: CI devops 2025

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build project
        run: mvn clean compile --file ./cours-devops/simpleapi/pom.xml

      - name: Run tests
        run: mvn test --file ./cours-devops/simpleapi/pom.xml

      - name: SonarCloud analysis
        run: mvn sonar:sonar \
          -Dsonar.projectKey=Patrice-IPE_DevOps-MlOps \
          -Dsonar.organization=patrice-ipe \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
          -Dsonar.verbose=true \
          --file ./cours-devops/simpleapi/pom.xml

      - name: Check Quality Gate
        run: mvn sonar:sonar \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.projectKey=Patrice-IPE_DevOps-MlOps \
          -Dsonar.organization=patrice-ipe \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
          --file ./cours-devops/simpleapi/pom.xml

  build-and-push-docker-image:
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./cours-devops/simpleapi
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-backend:latest

      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: ./cours-devops/Database
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest

      - name: Build and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./cours-devops/http-server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest