---
# tasks file for roles/database
- name: Run database
  docker_container:
    name: database
    image: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
    state: started
    restart_policy: always
    env:
      POSTGRES_DB=db
      POSTGRES_USER=usr
      POSTGRES_PASSWORD=pwd
    networks:
      - name: app_network